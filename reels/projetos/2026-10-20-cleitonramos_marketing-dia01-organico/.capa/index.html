<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Barlow"; font-weight: 900; src: url("assets/fonts/barlow-latin-900-normal.woff2") format("woff2"); }
      @font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("assets/fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #111111; overflow: hidden; }
      #root { position: relative; width: 100%; height: 100%; background: #111111; font-family: "Barlow", sans-serif; color: #F0ECE5; }
      .card { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 120px; gap: 48px; }
      .badge { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 44px; letter-spacing: 0.14em; color: #E85D26; }
      h1 { font-weight: 900; font-size: 150px; line-height: 0.9; letter-spacing: -0.035em; }
      .acc { color: #E85D26; }
      .rule { width: 72px; height: 6px; background: #E85D26; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="1">
      <section id="capa" class="clip card" data-start="0" data-duration="1">
        <div class="rule" id="capa-rule"></div>
        <h1 id="capa-t">O ORGÂNICO CONSTRÓI <span class="acc">NEGÓCIO?</span></h1>
        <div class="badge" id="capa-b">DIA 1/45</div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#capa-t", { opacity: 1 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
