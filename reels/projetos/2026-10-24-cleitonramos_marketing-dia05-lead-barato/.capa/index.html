<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face { font-family: "Montserrat"; font-weight: 900; src: url("assets/fonts/montserrat-latin-900-normal.woff2") format("woff2"); }
@font-face { font-family: "Montserrat"; font-weight: 600; src: url("assets/fonts/montserrat-latin-600-normal.woff2") format("woff2"); }

html, body { background:#03354e; overflow:hidden; }
#root { position:relative; width:1080px; height:1920px; overflow:hidden; font-family:"Montserrat",sans-serif; color:#fff;
  background: radial-gradient(120% 70% at 50% 110%, #0a4a66 0%, #03354e 55%, #022a3e 100%); }
.c { position:absolute; left:110px; right:110px; text-align:center; }
.pn { position:absolute; top:520px; width:400px; height:560px; border-radius:34px; padding:40px 30px; background:rgba(255,255,255,0.06); border:4px solid rgba(255,255,255,0.18); }
.pn small { display:block; font-weight:600; font-size:24px; letter-spacing:0.16em; color:rgba(255,255,255,0.75); }
.pn b { display:block; font-weight:900; font-size:54px; line-height:1.05; margin-top:14px; }
.pn .n { font-size:170px; letter-spacing:-0.04em; line-height:1; margin-top:60px; }
.pn .v { font-weight:900; font-size:34px; letter-spacing:0.1em; }
#L { left:100px; } #L b.t { color:#6FD3A0; } #L .n { color:#ff7b7b; } #L { opacity:0.8; }
#R { left:580px; border-color:#6FD3A0; } #R b.t { color:#ff7b7b; } #R .n { color:#6FD3A0; }

</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="1">
<section id="capa" class="clip" data-start="0" data-duration="1" style="position:absolute;inset:0">
<div class="pn" id="L"><small>CUSTO POR LEAD</small><b class="t">BARATO</b><div class="n">33</div><div class="v">VENDAS</div></div>
<div class="pn" id="R"><small>CUSTO POR LEAD</small><b class="t">CARO</b><div class="n">110+</div><div class="v">VENDAS</div></div>
<div class="c" id="d">DIA 5/45</div></section>
</div>
<script>const tl = gsap.timeline({ paused: true }); tl.set("#d", { opacity: 1 }, 0); window.__timelines["main"] = tl;</script>
</body></html>
